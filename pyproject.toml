[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storecast"
version = "0.1.0"
description = "Store-level demand forecasting and DDMRP-style reorder buffers, demonstrated on synthetic data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juan Manuel Dumit" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "lightgbm>=4.3",
  "scikit-learn>=1.3",  # LightGBM's sklearn API needs it
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses, safe as defaults.
extend-immutable-calls = ["storecast.buffers.BufferParams", "storecast.simulate.CostParams", "BufferParams", "CostParams"]
